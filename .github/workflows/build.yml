name: Build REDX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            lld llvm clang ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --upgrade buildozer "cython<3.1"

      - name: Configure buildozer.spec
        run: |
          python - << 'EOF'
          from pathlib import Path

          spec_path = Path("buildozer.spec")
          if not spec_path.exists():
              raise FileNotFoundError("buildozer.spec not found in repository root")

          content = spec_path.read_text(encoding="utf-8")
          lines = content.splitlines()

          clean_reqs = "python3,kivy,pyjnius,requests,urllib3,charset-normalizer"
          updated_reqs = False
          updated_license = False
          updated_androidx = False
          updated_p4a_branch = False
          new_lines = []

          for line in lines:
              stripped = line.strip()
              if stripped.startswith("requirements"):
                  new_lines.append(f"requirements = {clean_reqs}")
                  updated_reqs = True
              elif stripped.startswith("android.api"):
                  new_lines.append("android.api = 31")
              elif stripped.startswith("android.minapi"):
                  new_lines.append("android.minapi = 21")
              elif stripped.startswith("android.ndk"):
                  new_lines.append("android.ndk = 25c")
              elif stripped.startswith("android.archs"):
                  new_lines.append("android.archs = arm64-v8a")
              elif stripped.startswith("android.accept_sdk_license"):
                  new_lines.append("android.accept_sdk_license = True")
                  updated_license = True
              elif stripped.startswith("android.enable_androidx"):
                  new_lines.append("android.enable_androidx = True")
                  updated_androidx = True
              elif stripped.startswith("p4a.branch"):
                  new_lines.append("p4a.branch = develop")
                  updated_p4a_branch = True
              elif stripped.startswith("log_level"):
                  new_lines.append("log_level = 1")
              else:
                  new_lines.append(line)

          if not updated_reqs:
              new_lines.append(f"requirements = {clean_reqs}")
          if not updated_license:
              new_lines.append("android.accept_sdk_license = True")
          if not updated_androidx:
              new_lines.append("android.enable_androidx = True")
          if not updated_p4a_branch:
              new_lines.append("p4a.branch = develop")

          spec_path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          EOF

      - name: Build Android APK
        run: |
          unset PIP_CONSTRAINT || true
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_LATEST_HOME ANDROID_NDK_ROOT || true
          export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_HOME=/home/runner/.buildozer/android/platform/android-ndk-r25c
          export ANDROID_NDK=/home/runner/.buildozer/android/platform/android-ndk-r25c
          buildozer android debug

      - name: Show tail of buildozer log on failure
        if: failure()
        run: |
          ls -la .buildozer/logs || true
          tail -n 80 .buildozer/logs/*.txt || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redx-apk
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: .buildozer/logs/*.txt
          if-no-files-found: ignore

