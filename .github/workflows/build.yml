name: Build REDX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          printf "charset-normalizer<3.5.0\ncython<3.0\n" > /tmp/constraints.txt
          export PIP_CONSTRAINT="/tmp/constraints.txt"
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "cython==0.29.36" buildozer

      - name: Setup SDK and NDK
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r27.2.12479018
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal"
          rm -rf .buildozer ~/.buildozer
          mkdir -p ~/.buildozer/android/platform
          mkdir -p "$PWD/.buildozer/android/platform"
          curl -fL --retry 5 --retry-delay 5 -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extracted
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mv /tmp/cmdline-extracted/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sfn ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sfn ~/.buildozer/android/platform/android-sdk "$PWD/.buildozer/android/platform/android-sdk"
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$HOME/.buildozer/android/platform/android-sdk" "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;27.2.12479018"
          if [ -d "$HOME/.buildozer/android/platform/android-sdk/ndk/27.2.12479018" ]; then
            ln -sfn "$HOME/.buildozer/android/platform/android-sdk/ndk/27.2.12479018" "$HOME/.buildozer/android/platform/android-ndk-r27.2.12479018"
          fi
          ln -sfn "$HOME/.buildozer/android/platform/android-ndk-r27.2.12479018" "$PWD/.buildozer/android/platform/android-ndk-r27.2.12479018"

      - name: Configure buildozer.spec
        run: |
          if [ -f buildozer.spec ]; then
            sed -i 's/^#\?\s*android.api\s*=.*/android.api = 33/' buildozer.spec
            sed -i 's/^#\?\s*android.minapi\s*=.*/android.minapi = 24/' buildozer.spec
            sed -i 's/^#\?\s*android.ndk\s*=.*/android.ndk = 27.2.12479018/' buildozer.spec
            sed -i 's/^#\?\s*android.accept_sdk_license\s*=.*/android.accept_sdk_license = True/' buildozer.spec
          fi

      - name: Build Android APK
        run: |
          set +e
          export ACLOCAL_PATH="/usr/share/aclocal"
          printf "charset-normalizer<3.5.0\ncython<3.0\n" > /tmp/constraints.txt
          export PIP_CONSTRAINT="/tmp/constraints.txt"
          python -m pip install --upgrade "cython==0.29.36"
          buildozer android debug > /tmp/buildozer.log 2>&1
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            {
              echo "===== ACTUAL ERRORS ====="
              grep -i -E "error:|fatal error|undefined reference|no such file or directory|command failed|failed with exit code|no matching distribution|could not find|not resolved" /tmp/buildozer.log | grep -v "performance hint" | grep -v "webpdecoder_static" | tail -n 35 || true
              echo "===== TAIL OF LOG ====="
              tail -n 35 /tmp/buildozer.log
            } > error_tail.txt
            cat error_tail.txt
            exit "$EXIT_CODE"
          fi
          find . -maxdepth 4 -name "*.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REDX-APK
          path: "**/*.apk"
          if-no-files-found: warn

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: REDX-Error-Log
          path: error_tail.txt
          if-no-files-found: ignore
