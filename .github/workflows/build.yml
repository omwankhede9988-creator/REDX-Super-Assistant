name: Build REDX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            lld llvm clang ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --upgrade buildozer "cython<3.1"

      - name: Configure buildozer.spec
        run: |
          python - << 'EOF'
          from pathlib import Path

          spec_path = Path("buildozer.spec")
          if not spec_path.exists():
              raise FileNotFoundError("buildozer.spec not found in repository root")

          content = spec_path.read_text(encoding="utf-8")
          lines = content.splitlines()

          clean_reqs = "python3,kivy,pyjnius,requests,urllib3,charset-normalizer"
          updated_reqs = False
          new_lines = []

          for line in lines:
              stripped = line.strip()
              if stripped.startswith("requirements"):
                  new_lines.append(f"requirements = {clean_reqs}")
                  updated_reqs = True
              elif stripped.startswith("android.api"):
                  new_lines.append("android.api = 33")
              elif stripped.startswith("android.minapi"):
                  new_lines.append("android.minapi = 21")
              elif stripped.startswith("android.ndk"):
                  new_lines.append("android.ndk = 25c")
              elif stripped.startswith("log_level"):
                  new_lines.append("log_level = 2")
              else:
                  new_lines.append(line)

          if not updated_reqs:
              new_lines.append(f"requirements = {clean_reqs}")

          spec_path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          EOF

      - name: Build Android APK
        run: |
          unset PIP_CONSTRAINT || true
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME || true
          buildozer android debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redx-apk
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: .buildozer/logs/*.txt
          if-no-files-found: ignore

