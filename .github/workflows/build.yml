name: Build REDX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl aria2 openjdk-17-jdk autoconf automake autotools-dev \
            libtool libtool-bin libltdl-dev m4 gettext pkg-config \
            zlib1g-dev libncurses5-dev libncursesw6 libtinfo6 libncurses-dev \
            cmake libffi-dev libssl-dev lld python3-setuptools

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer==1.5.0 "python-for-android==2024.1.21" "cython==0.29.36" "sh<2.0,>=1.10" virtualenv setuptools

      - name: Prepare cache and build APK
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal:${ACLOCAL_PATH:-}"
          rm -rf .buildozer ~/.buildozer
          mkdir -p ~/.buildozer/android/packages
          wget -c --tries=10 --timeout=30 \
            "https://dl.google.com/android/repository/android-ndk-r27.2.12479018-linux.zip" \
            -O ~/.buildozer/android/packages/android-ndk-r27.2.12479018-linux.zip || true
          ls -lh ~/.buildozer/android/packages/
          buildozer android debug || buildozer android debug

      - name: Check generated APK files
        run: |
          find . -maxdepth 4 -name "*.apk" -ls

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REDX-APK
          path: "**/*.apk"
          if-no-files-found: warn
