name: Build REDX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake autotools-dev \
            libtool libtool-bin libltdl-dev m4 gettext pkg-config \
            zlib1g-dev libncurses5-dev libncursesw6 libtinfo6 libncurses-dev \
            cmake libffi-dev libssl-dev lld python3-setuptools

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv setuptools

      - name: Clean stale build cache and build APK
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal:${ACLOCAL_PATH:-}"
          rm -rf .buildozer ~/.buildozer
          buildozer android debug

      - name: Check generated APK files
        run: |
          find . -maxdepth 4 -name "*.apk" -ls

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REDX-APK
          path: "**/*.apk"
          if-no-files-found: warn

