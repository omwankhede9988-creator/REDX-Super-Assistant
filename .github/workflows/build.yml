name: Build REDX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y git zip unzip wget curl openjdk-17-jdk autoconf automake autotools-dev libtool libtool-bin libltdl-dev m4 gettext pkg-config zlib1g-dev libncurses5-dev libncursesw6 libtinfo6 libncurses-dev cmake libffi-dev libssl-dev lld python3-setuptools

      - name: Install buildozer and cython
        run: python -m pip install --upgrade pip && pip install --upgrade buildozer==1.5.0 "python-for-android==2024.1.21" "cython==0.29.36" "sh<2.0,>=1.10" virtualenv setuptools

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          NDK_HOME: ""
        run: bash .github/scripts/build_apk.sh

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REDX-APK
          path: "**/*.apk"
          if-no-files-found: warn

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: REDX-Error-Log
          path: error_tail.txt
          if-no-files-found: ignore
