name: Build REDX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libltdl-dev pkg-config libssl-dev zlib1g-dev libncurses5-dev libncursesw6 libtinfo5 cmake libffi-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "cython==0.29.36" buildozer

      - name: Setup SDK and NDK
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r27.2.12479018
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          sudo update-java-alternatives -s java-1.17.0-openjdk-amd64 || true
          rm -rf .buildozer ~/.buildozer
          mkdir -p ~/.buildozer/android/platform
          mkdir -p "$ANDROID_NDK_ROOT"
          curl -fL --retry 5 --retry-delay 5 -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extracted
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-extracted/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sfn "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sfn "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          if [ -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ]; then
            ln -sfn "$ANDROID_SDK_ROOT/ndk/27.2.12479018"/* "$ANDROID_NDK_ROOT/"
          fi
          ln -sfn "$ANDROID_NDK_ROOT" ~/.buildozer/android/platform/android-ndk-r27.2.12479018

      - name: Configure buildozer.spec
        run: |
          python3 - <<'EOF'
          import re

          spec_path = "buildozer.spec"
          with open(spec_path, "r", encoding="utf-8", errors="ignore") as f:
              text = f.read()

          text = re.sub(r'(?m)^#?\s*android\.api\s*=.*', 'android.api = 34', text)
          text = re.sub(r'(?m)^#?\s*android\.minapi\s*=.*', 'android.minapi = 24', text)
          text = re.sub(r'(?m)^#?\s*android\.ndk\s*=.*', 'android.ndk = 27.2.12479018', text)
          text = re.sub(r'(?m)^#?\s*android\.accept_sdk_license\s*=.*', 'android.accept_sdk_license = True', text)

          if re.search(r'(?m)^#?\s*p4a\.branch\s*=', text):
              text = re.sub(r'(?m)^#?\s*p4a\.branch\s*=.*', 'p4a.branch = master', text)
          else:
              text += "\np4a.branch = master\n"

          def clean_reqs(match):
              prefix = match.group(1)
              raw = match.group(2)
              parts = [p.strip() for p in raw.split(",") if p.strip()]
              cleaned = []
              for p in parts:
                  low = p.lower()
                  if low == "android" or low.startswith("android=="):
                      continue
                  if low.startswith("kivy"):
                      p = "kivy==2.3.0"
                  elif low.startswith("pyjnius"):
                      p = "pyjnius"
                  if p not in cleaned:
                      cleaned.append(p)
              if "python3" not in cleaned:
                  cleaned.insert(0, "python3")
              return prefix + ",".join(cleaned)

          text = re.sub(r'(?m)^(\s*requirements\s*=\s*)(.+)$', clean_reqs, text)

          with open(spec_path, "w", encoding="utf-8") as f:
              f.write(text)
          print("Updated buildozer.spec successfully.")
          EOF

      - name: Patch libffi recipe before build
        run: |
          python3 - <<'EOF'
          import glob, os

          for path in glob.glob(os.path.expanduser("~/.buildozer/**/recipes/libffi/__init__.py"), recursive=True) + glob.glob(".buildozer/**/recipes/libffi/__init__.py", recursive=True):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              if "libtoolize" not in content and "autoreconf" in content:
                  patched = content.replace(
                      'shprint(sh.autoreconf, "-vif"',
                      'shprint(sh.libtoolize, "--force", "--copy"); shprint(sh.autoreconf, "-vif"'
                  )
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(patched)
                  print("Patched:", path)
          EOF

      - name: Build Android APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          unset PIP_CONSTRAINT || true
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 - <<'EOF'
          import os

          ndk_bin_dir = "/home/runner/.buildozer/android/platform/android-ndk-r27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if os.path.isdir(ndk_bin_dir):
              for name in os.listdir(ndk_bin_dir):
                  if "clang" in name and not name.endswith(".real"):
                      full_path = os.path.join(ndk_bin_dir, name)
                      real_path = full_path + ".real"
                      if os.path.isfile(full_path) and not os.path.islink(full_path) and not os.path.exists(real_path):
                          os.rename(full_path, real_path)
                          with open(full_path, "w", encoding="utf-8") as wf:
                              wf.write(
                                  "#!/usr/bin/env bash\n"
                                  "args=()\n"
                                  "for a in \"$@\"; do\n"
                                  "  if [ \"$a\" != \"-print-multi-os-directory\" ]; then\n"
                                  "    args+=(\"$a\")\n"
                                  "  fi\n"
                                  "done\n"
                                  f"exec \"{real_path}\" \"${{args[@]}}\"\n"
                              )
                          os.chmod(full_path, 0o755)
          EOF
          set +e
          buildozer android debug > /tmp/buildozer.log 2>&1
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== ACTUAL ERRORS ==="
            grep -i -E "error:|fatal error:|undefined reference|no such file or directory|command failed|failed with e" /tmp/buildozer.log | head -n 60 || true
            echo "=== TAIL OF LOG ==="
            tail -n 80 /tmp/buildozer.log > error_tail.txt
            cat error_tail.txt
            exit "$EXIT_CODE"
          fi
          find . -maxdepth 4 -name "*.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REDX-APK
          path: "**/*.apk"
          if-no-files-found: warn

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: REDX-error-log
          path: error_tail.txt
          if-no-files-found: ignore
